<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Langton's Ant</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230c111b'/><rect x='3' y='3' width='5' height='5' fill='%23f4cf7a'/><rect x='8' y='8' width='5' height='5' fill='%23f4cf7a'/><circle cx='10.5' cy='5.5' r='2' fill='%23ff4f6e'/></svg>">
  <!-- Self-contained on purpose: GitHub Pages serves this file for any missing path, so relative asset URLs would break. -->
  <style>
    :root {
      --bg: #0c111b;
      --panel: rgba(14, 19, 30, 0.78);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #e7eaf0;
      --text-dim: #8b93a7;
      --accent: #f4cf7a;
      --accent-ink: #1a1405;
      --ant: #ff4f6e;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 var(--font);
      -webkit-font-smoothing: antialiased;
    }

    #background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.45;
    }

    main {
      position: relative;
      display: grid;
      place-items: center;
      height: 100%;
      padding: 16px;
    }

    .card {
      max-width: 440px;
      padding: 32px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .code {
      margin: 0;
      font: 700 72px/1 var(--mono);
      letter-spacing: -0.04em;
      color: var(--accent);
    }

    .code span {
      color: var(--ant);
    }

    h1 {
      margin: 16px 0 8px;
      font-size: 20px;
      font-weight: 650;
    }

    p {
      margin: 0;
      color: var(--text-dim);
    }

    .path {
      display: inline-block;
      max-width: 100%;
      margin-top: 12px;
      padding: 4px 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.3);
      font: 12px var(--mono);
      color: var(--text);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      height: 40px;
      padding: 0 18px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn:hover {
      background: #f8dc98;
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    @media (prefers-reduced-motion: reduce) {
      #background {
        display: none;
      }
    }
  </style>
</head>

<body>
  <canvas id="background" aria-hidden="true"></canvas>

  <main>
    <div class="card">
      <p class="code">4<span>0</span>4</p>
      <h1>The ant wandered off</h1>
      <p>There is nothing at this address. Every cell here is still white.</p>
      <code class="path" id="path"></code>
      <br>
      <a class="btn" id="home" href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 5v14l12-7z" />
        </svg>
        Back to the simulation
      </a>
    </div>
  </main>

  <script>
    (function () {
      // On GitHub Pages project sites the app lives under /<repo>/, not at the root.
      let base = '/';
      if (location.hostname.endsWith('github.io')) {
        const repo = location.pathname.split('/')[1];
        if (repo) {
          base = `/${repo}/`;
        }
      }
      document.getElementById('home').href = base;
      document.getElementById('path').textContent = location.pathname;

      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }

      const CELL = 8;
      const STEPS_PER_FRAME = 12;
      const DX = [0, 1, 0, -1];
      const DY = [-1, 0, 1, 0];
      const canvas = document.getElementById('background');
      const ctx = canvas.getContext('2d');
      let cols = 0;
      let rows = 0;
      let cells = null;
      let ant = null;

      function reset() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(innerWidth * dpr);
        canvas.height = Math.round(innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cols = Math.ceil(innerWidth / CELL);
        rows = Math.ceil(innerHeight / CELL);
        cells = new Uint8Array(cols * rows);
        // Start top-right so the chaos stays clear of the card and the highway crosses the screen.
        ant = { x: Math.floor(cols * 0.8), y: Math.floor(rows * 0.25), dir: 0 };
        ctx.fillStyle = '#0c111b';
        ctx.fillRect(0, 0, innerWidth, innerHeight);
      }

      function drawCell(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
      }

      function step() {
        const i = ant.y * cols + ant.x;

        if (cells[i]) {
          ant.dir = (ant.dir + 3) % 4;
        } else {
          ant.dir = (ant.dir + 1) % 4;
        }
        cells[i] ^= 1;

        if (cells[i]) {
          drawCell(ant.x, ant.y, '#f4cf7a');
        } else {
          drawCell(ant.x, ant.y, '#0c111b');
        }

        // Wrap around: this is just decoration, not the real simulation.
        ant.x = (ant.x + DX[ant.dir] + cols) % cols;
        ant.y = (ant.y + DY[ant.dir] + rows) % rows;
      }

      function frame() {
        for (let n = 0; n < STEPS_PER_FRAME; n++) {
          step();
        }
        drawCell(ant.x, ant.y, '#ff4f6e');
        requestAnimationFrame(frame);
      }

      let resizeTimer = 0;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(reset, 150);
      });

      reset();
      requestAnimationFrame(frame);
    })();
  </script>
</body>

</html>
