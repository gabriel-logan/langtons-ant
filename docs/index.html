<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Langton's Ant</title>
  <meta name="description"
    content="Langton's Ant in C compiled to WebAssembly, rendered with WebGL2 inside a Web Worker.">
  <meta name="color-scheme" content="dark">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230c111b'/><rect x='3' y='3' width='5' height='5' fill='%23f4cf7a'/><rect x='8' y='8' width='5' height='5' fill='%23f4cf7a'/><circle cx='10.5' cy='5.5' r='2' fill='%23ff4f6e'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <canvas id="view" aria-label="Langton's Ant view"></canvas>

  <button class="panel-toggle" id="panel-toggle" aria-controls="panel" aria-expanded="true" title="Show/hide panel">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <aside class="panel" id="panel">
    <header class="panel__header">
      <div class="brand">
        <svg class="brand__logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="4" y="4" width="11" height="11" rx="2" class="cell" />
          <rect x="17" y="17" width="11" height="11" rx="2" class="cell" />
          <circle cx="22.5" cy="9.5" r="4.5" class="ant" />
        </svg>
        <div>
          <h1>Langton's Ant</h1>
          <p class="subtitle">C → WebAssembly · WebGL2 · Web Worker</p>
        </div>
      </div>
    </header>

    <section class="section">
      <div class="section__title">
        <h2>Simulation</h2>
        <span class="status" id="status" data-state="idle">Loading…</span>
      </div>
      <div class="btn-row">
        <button class="btn btn--primary" id="btn-start" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5v14l12-7z" />
          </svg>
          Start
        </button>
        <button class="btn" id="btn-stop" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5h4v14H7zM13 5h4v14h-4z" />
          </svg>
          Stop
        </button>
        <button class="btn" id="btn-restart" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5" class="stroke" />
          </svg>
          Restart
        </button>
      </div>
    </section>

    <section class="section">
      <div class="section__title">
        <h2><label for="speed">Speed</label></h2>
        <output id="speed-value" for="speed" class="mono">—</output>
      </div>
      <input type="range" id="speed" class="range">
      <div class="range__labels"><span>1/s</span><span>1M/s</span><span>max</span></div>
    </section>

    <section class="section">
      <div class="section__title">
        <h2><label for="max-steps">Max steps</label></h2>
        <span class="hint mono" id="max-steps-hint"></span>
      </div>
      <form class="field" id="max-steps-form">
        <input type="number" id="max-steps" class="input mono" min="1" step="1" inputmode="numeric">
        <button type="submit" class="btn btn--small">Apply</button>
      </form>
      <div class="progress" role="progressbar" aria-label="Progress" id="progress">
        <div class="progress__bar" id="progress-bar"></div>
      </div>
    </section>

    <section class="section">
      <div class="section__title">
        <h2>Camera</h2>
        <span class="hint mono" id="zoom-value">—</span>
      </div>
      <div class="segmented" role="radiogroup" aria-label="Camera mode">
        <button role="radio" class="segmented__item" id="cam-follow" aria-checked="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M12 2v4M12 18v4M2 12h4M18 12h4" class="stroke" />
          </svg>
          Follow ant
        </button>
        <button role="radio" class="segmented__item" id="cam-free" aria-checked="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2l3 3h-2v6h6V9l3 3-3 3v-2h-6v6h2l-3 3-3-3h2v-6H5v2l-3-3 3-3v2h6V5H9z" />
          </svg>
          Free
        </button>
      </div>
      <div class="btn-row">
        <button class="btn" id="zoom-out" title="Zoom out (−)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" class="stroke" />
            <path d="M8 11h6M16.5 16.5L21 21" class="stroke" />
          </svg>
          Zoom −
        </button>
        <button class="btn" id="zoom-in" title="Zoom in (+)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" class="stroke" />
            <path d="M8 11h6M11 8v6M16.5 16.5L21 21" class="stroke" />
          </svg>
          Zoom +
        </button>
      </div>
    </section>

    <section class="section">
      <h2>Statistics</h2>
      <dl class="stats">
        <div>
          <dt>Steps</dt>
          <dd class="mono" id="stat-steps">0</dd>
        </div>
        <div>
          <dt>Actual speed</dt>
          <dd class="mono" id="stat-rate">—</dd>
        </div>
        <div>
          <dt>Position</dt>
          <dd class="mono" id="stat-pos">(0, 0)</dd>
        </div>
        <div>
          <dt>Direction</dt>
          <dd id="stat-dir">North</dd>
        </div>
        <div>
          <dt>Black cells</dt>
          <dd class="mono" id="stat-black">0</dd>
        </div>
        <div>
          <dt>Grid</dt>
          <dd class="mono" id="stat-grid">—</dd>
        </div>
        <div class="stats__wide">
          <dt>Phase</dt>
          <dd id="stat-phase">—</dd>
        </div>
      </dl>
    </section>

    <footer class="panel__footer">
      <span><kbd>Space</kbd> start/stop</span>
      <span><kbd>R</kbd> restart</span>
      <span><kbd>F</kbd> follow</span>
      <span><kbd>+</kbd><kbd>−</kbd> zoom</span>
      <span><kbd>←↑→↓</kbd> pan</span>
      <span>Drag to pan · wheel to zoom</span>
    </footer>
  </aside>

  <div class="toast" id="toast" role="alert" hidden></div>
</body>

</html>
